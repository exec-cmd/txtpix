<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <title>txtpix</title>
  <!-- Icon: 4x4 pixel grid with a brightness ramp, the same idea as the ASCII shading in the engine -->
  <rect x="0" y="0" width="560" height="200" rx="28" fill="#0e1116"/>
  <rect x="20" y="20" width="160" height="160" rx="22" fill="#161b22" stroke="#2fb36b" stroke-opacity="0.35" stroke-width="2"/>
  <g fill="#3ddc84">
    <rect x="32" y="32" width="28" height="28" rx="4" fill-opacity="0.15"/>
    <rect x="68" y="32" width="28" height="28" rx="4" fill-opacity="0.35"/>
    <rect x="104" y="32" width="28" height="28" rx="4" fill-opacity="0.6"/>
    <rect x="140" y="32" width="28" height="28" rx="4" fill-opacity="0.9"/>

    <rect x="32" y="68" width="28" height="28" rx="4" fill-opacity="0.35"/>
    <rect x="68" y="68" width="28" height="28" rx="4" fill-opacity="0.6"/>
    <rect x="104" y="68" width="28" height="28" rx="4" fill-opacity="0.9"/>
    <rect x="140" y="68" width="28" height="28" rx="4" fill-opacity="0.6"/>

    <rect x="32" y="104" width="28" height="28" rx="4" fill-opacity="0.6"/>
    <rect x="68" y="104" width="28" height="28" rx="4" fill-opacity="0.9"/>
    <rect x="104" y="104" width="28" height="28" rx="4" fill-opacity="0.6"/>
    <rect x="140" y="104" width="28" height="28" rx="4" fill-opacity="0.35"/>

    <rect x="32" y="140" width="28" height="28" rx="4" fill-opacity="0.9"/>
    <rect x="68" y="140" width="28" height="28" rx="4" fill-opacity="0.6"/>
    <rect x="104" y="140" width="28" height="28" rx="4" fill-opacity="0.35"/>
    <rect x="140" y="140" width="28" height="28" rx="4" fill-opacity="0.15"/>
  </g>
  <!-- Wordmark -->
  <text x="208" y="131" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="84" font-weight="700" letter-spacing="-2"><tspan fill="#e6edf3">txt</tspan><tspan fill="#3ddc84">pix</tspan></text>
</svg>
